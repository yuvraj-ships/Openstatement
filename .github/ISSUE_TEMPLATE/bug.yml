name: Bug report
description: Something in the app or library is broken (not bank-specific).
labels: [bug]
body:
  - type: markdown
    attributes:
      value: ⚠️ Please never attach real bank statements. If you can reproduce the problem with one of the sample statements in the app, that's ideal.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: env
    attributes:
      label: Browser / OS, or Node version
